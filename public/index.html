<!DOCTYPE html>
<html lang="it">
  <head>
    <script>
      // Il portale si e' spostato su app.pmi360.it: il vecchio indirizzo rimanda li', conservando invito e dati di accesso
      if (location.hostname.endsWith('github.io')) location.replace('https://app.pmi360.it/' + location.search + location.hash)
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A3A5C" />
    <meta name="description" content="Toolkit Pmi 360° — Sistema multiaziendale di gestione dei rischi" />
    <!-- Anti-cache: la pagina d'ingresso non viene mai congelata dal browser,
         così gli utenti ricevono sempre l'ultima versione pubblicata.
         I file JS/CSS di build hanno un nome con hash e restano cache-abili. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Toolkit Pmi 360°</title>
  </head>
  <body>
    <noscript>Devi abilitare JavaScript per usare questa applicazione.</noscript>
    <div id="root"></div>
  </body>
</html>
